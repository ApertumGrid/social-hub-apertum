<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Test Referral Signup</title>
<style>
body { font-family: monospace; padding: 20px; background: #0a0e1a; color: #fff; }
.log { background: #000; padding: 20px; border-radius: 8px; margin: 20px 0; }
.success { color: #22c55e; }
.error { color: #ef4444; }
button { padding: 12px 24px; background: #7c5cbf; color: #fff; border: none; border-radius: 8px; cursor: pointer; font-size: 16px; margin: 10px 5px; }
input { padding: 8px; width: 400px; margin: 10px 0; }
pre { background: rgba(255,255,255,0.05); padding: 10px; border-radius: 4px; overflow-x: auto; }
</style>
</head>
<body>

<h1>🧪 Referral Signup Test</h1>

<div class="log" id="log"></div>

<h2>Step 1: Set Referral in LocalStorage</h2>
<p>Ashley's referral address: <strong>0xe348fedea1850a0c2d4ac0fed3f903774de1e16a</strong></p>
<button onclick="setReferral()">Set sh_ref in localStorage</button>

<h2>Step 2: Simulate New User Signup</h2>
<p>Test wallet address: <strong>0x0000000000000000000000000000000000000TEST</strong></p>
<button onclick="simulateSignup()">Simulate Wallet Connection & Referral Write</button>

<h2>Step 3: Verify Results</h2>
<button onclick="checkResults()">Check Ashley's Referral Stats (After)</button>

<h2>Step 4: Cleanup</h2>
<button onclick="cleanup()">Delete Test User Data</button>

<script type="module">
import { initializeApp } from 'https://www.gstatic.com/firebasejs/9.22.0/firebase-app.js';
import { getFirestore, doc, getDoc, setDoc, updateDoc, increment, deleteDoc } from 'https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore.js';

const firebaseConfig = {
    apiKey: "AIzaSyA3c9CVx1eY8_m_16LN4QTmmPXZh_UJdwA",
    authDomain: "socialhubaptm.firebaseapp.com",
    projectId: "socialhubaptm",
    storageBucket: "socialhubaptm.firebasestorage.app",
    messagingSenderId: "27568726411",
    appId: "1:27568726411:web:1a60222f37b365b1464f8e",
    measurementId: "G-9HKL98ZJER"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);
window.db = db;

const ASHLEY_ADDR = '0xe348fedea1850a0c2d4ac0fed3f903774de1e16a';
const TEST_USER = '0x0000000000000000000000000000000000000test';

function log(msg, type = 'info') {
    const logEl = document.getElementById('log');
    const color = type === 'success' ? '#22c55e' : type === 'error' ? '#ef4444' : '#fff';
    logEl.innerHTML += `<div style="color:${color}">[${new Date().toLocaleTimeString()}] ${msg}</div>`;
    logEl.scrollTop = logEl.scrollHeight;
    console.log(msg);
}

window.setReferral = function() {
    localStorage.setItem('sh_ref', ASHLEY_ADDR.toLowerCase());
    log('✓ Set sh_ref = ' + ASHLEY_ADDR.toLowerCase(), 'success');
    const stored = localStorage.getItem('sh_ref');
    log('  Verified: localStorage.sh_ref = ' + stored, 'success');
};

window.simulateSignup = async function() {
    log('\n=== SIMULATING NEW USER SIGNUP ===');

    const storedRef = localStorage.getItem('sh_ref');
    if (!storedRef) {
        log('❌ ERROR: sh_ref not found in localStorage. Run Step 1 first!', 'error');
        return;
    }

    log('Stored referral code: ' + storedRef);
    log('New user address: ' + TEST_USER);

    try {
        // 1. Check if user already exists
        log('\n1. Checking if test user already exists...');
        const userRef = doc(db, 'users', TEST_USER);
        const userSnap = await getDoc(userRef);

        if (userSnap.exists() && userSnap.data().referredBy) {
            log('⚠ User already has referredBy set. Skipping write.', 'error');
            log('  Current referredBy: ' + userSnap.data().referredBy);
            return;
        }

        // 2. Write referredBy to user document
        log('\n2. Writing referredBy to users/' + TEST_USER);
        if (userSnap.exists()) {
            await updateDoc(userRef, { referredBy: storedRef });
            log('✓ Updated existing user document', 'success');
        } else {
            await setDoc(userRef, {
                referredBy: storedRef,
                createdAt: Date.now(),
                testUser: true
            });
            log('✓ Created new user document', 'success');
        }

        // 3. Increment referral_stats
        log('\n3. Incrementing referral_stats/' + storedRef);
        const statsRef = doc(db, 'referral_stats', storedRef);
        await setDoc(statsRef, {
            totalReferred: increment(1)
        }, { merge: true });
        log('✓ Incremented totalReferred', 'success');

        // 4. Clear localStorage
        localStorage.removeItem('sh_ref');
        log('\n4. Cleared sh_ref from localStorage', 'success');

        log('\n✅ SIGNUP SIMULATION COMPLETE!', 'success');
        log('   Ashley should now have 1 referral.', 'success');

    } catch (error) {
        log('❌ ERROR: ' + error.message, 'error');
        console.error(error);
    }
};

window.checkResults = async function() {
    log('\n=== CHECKING ASHLEY\'S REFERRAL STATS ===');

    try {
        // Query via Cloud Function
        const response = await fetch('https://us-central1-socialhubaptm.cloudfunctions.net/debugReferrals?address=' + ASHLEY_ADDR);
        const data = await response.json();

        log('\nReferral Stats:');
        log('  totalReferred: ' + (data.referral_stats?.totalReferred || 0), 'success');
        log('  totalEarned: ' + (data.referral_stats?.totalEarned || 0), 'success');

        log('\nReferred Users (' + (data.referred_users?.length || 0) + '):');
        if (data.referred_users && data.referred_users.length > 0) {
            data.referred_users.forEach(u => {
                log('  - ' + u.address + ' (spent: ' + u.referralSpendTotal + '★)', 'success');
            });
        } else {
            log('  (none)', 'error');
        }

        // Also check test user document directly
        log('\nTest User Document:');
        const testUserSnap = await getDoc(doc(db, 'users', TEST_USER));
        if (testUserSnap.exists()) {
            const data = testUserSnap.data();
            log('  referredBy: ' + (data.referredBy || 'null'), 'success');
            log('  testUser: ' + (data.testUser || false), 'success');
        } else {
            log('  (does not exist)', 'error');
        }

    } catch (error) {
        log('❌ ERROR: ' + error.message, 'error');
    }
};

window.cleanup = async function() {
    log('\n=== CLEANUP: DELETING TEST DATA ===');

    try {
        // 1. Delete test user
        log('1. Deleting users/' + TEST_USER);
        await deleteDoc(doc(db, 'users', TEST_USER));
        log('✓ Test user deleted', 'success');

        // 2. Decrement Ashley's referral count
        log('\n2. Decrementing Ashley\'s totalReferred');
        const statsRef = doc(db, 'referral_stats', ASHLEY_ADDR.toLowerCase());
        await setDoc(statsRef, {
            totalReferred: increment(-1)
        }, { merge: true });
        log('✓ Decremented totalReferred', 'success');

        log('\n✅ CLEANUP COMPLETE', 'success');

    } catch (error) {
        log('❌ ERROR: ' + error.message, 'error');
    }
};

log('✓ Test page loaded. Firebase initialized.', 'success');
log('Ready to test referral signup flow.', 'success');
</script>

</body>
</html>
